# Cat A SFT — the C2 recipe on gemma-4-E4B, task-a-sft-v3 corpus.
#
# The size arm of a two-arm comparison (docs/training_plan_voice_and_e4b.md):
#   C2-v3   gemma-4-26B-A4B  configs/training/sft_cat_a_c2_corpus_v3.yaml
#   E4B     gemma-4-E4B      this file
# Same corpus, same recipe, so the difference between them is model size.
# Run with:
#   env -u UNSLOTH_VLLM_STANDBY ./scripts/run_phase2_sft.sh \
#       --model-config configs/models_exp_a/gemma4_e4b.yaml \
#       --sft-config configs/training/sft_cat_a_e4b.yaml
#
# This file differs from sft_cat_a_c2_corpus_v3.yaml in output_dir ONLY, and
# tests/unit/test_sft_cat_a_e4b_config.py enforces that. E4B is a 4B dense model
# with far more VRAM headroom than the 26B; changing any hyperparameter to use
# it would confound size with recipe and spend the experiment (R15, R16).
#
# The runbook says to copy sft_cat_a_c2.yaml. That file now describes the
# task-a-sft-v2 run and opens with a STOP banner (#55); the C2 arm on this
# corpus is sft_cat_a_c2_corpus_v3.yaml, so that is the file this one mirrors.
# The hyperparameters of the two are identical either way.
#
# HOW TO READ THE RESULT — compare against C2-v3, not against the stored 0.7595.
# That number was measured on a 206-row set that no longer reconstructs from
# the v3 splits (see the header of sft_cat_a_c2_corpus_v3.yaml), which also
# makes the runbook's section 7 held-out command stale. Score both arms on
# data/output/heldout/cat_a_v3_test_not_in_v2 (304 text rows). Report voice
# separately on data/output/heldout/cat_a_v3_test_voice (146 rows) and never
# blend it into the composite (R20).
#
# freeze_router is false in BOTH arms. Before the _freeze_modules fix, true
# froze every mlp.gate_proj LoRA adapter (a substring match on "mlp.gate") and
# never the router; see the comment on that key in
# sft_cat_a_c2_corpus_v3.yaml. E4B is dense and has no router, so under the
# fixed code the flag freezes nothing here either way. Both arms match, so
# they train identical parameter sets.
#
# output_dir keeps this run off every C2 checkpoint path (CLAUDE.md R13).
output_dir: "sft_cat_a_e4b"

stage: "sft"
framework: "unsloth"

model:
  config_path: null

lora:
  # Unchanged from C2 so LoRA capacity is not a confound.
  rank: 16
  alpha: 16
  dropout: 0
  target_modules: "auto"   # ignored for Gemma-4 (toggle-flag form used)
  # false: see the comment on this key in sft_cat_a_c2_corpus_v3.yaml.
  freeze_router: false
  seed: 3407

training:
  precision: "bf16"
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  per_device_train_batch_size: 1
  effective_batch_size: 8
  optim: "adamw_8bit"
  weight_decay: 0.001
  num_epochs: 3
  # 8192 covers 99% of Task A conversations (median 4,264 / p90 6,055 / max
  # 9,108 tokens; scripts/measure_sft_token_budget.py). Verify this landed:
  # R16 records every Cat A SFT run before 2026-08-13 silently training at
  # max_length 1024 because TRL renamed the kwarg. Check train.log for
  # max_length=8192, and that loss is not 0.0, before letting the run proceed.
  max_seq_length: 8192
  gradient_checkpointing: true
  packing: false
  # Loss only on assistant spans; system/user/tool -> -100.
  #
  # MANDATORY on this corpus, not a preference. v3 contains voice rows whose
  # barge-in turn carries "loss": false, and all_tokens has no per-token
  # masking to honour it — it would train the model to emit the <unspoken>
  # marker (R20). sft.py logs all_tokens_ignores_loss_flag if this is wrong;
  # grep train.log for it and expect no hit.
  loss_mask: "response_only"

data:
  # task-a-sft-v3 (tag). Expected: 53f4fee095b3824b203344075cd3fdd7.dir
  # (3 files), 8,441 train / 992 validation / 499 test over 9,932 conversations
  # — 7,043 text and 2,889 voice. Check train.log's row counts, not this path:
  # the same path held v2 once (R13).
  source: "data/output/sft/task_a_splits"
  format: "chatml"
  splits:
    train: 0.85
    val: 0.10
    test: 0.05

logging:
  wandb_project: "llm-workflow-agents-sft"
  save_steps: 500
  eval_steps: 500
  # Ranks checkpoints WITHIN this run only. eval_loss cannot rank this run
  # against C2-v3: the models differ, so their losses are not on one scale.
  # Rank arms with the held-out audit.
  metric_for_best_model: "eval_loss"
