# Cat A preference learning — DPO on the C2 checkpoint.
#
# WHY THIS FILE EXISTS: R18 / docs/grpo_reward_resolution_investigation.md.
# GRPO cannot learn on this task — the per-turn reward is exactly 1.0 on 81.1%
# of real completions, so groups tie and the advantage is zero. Three
# independent fixes (tool-bearing mix, trajectory aggregation, temperature)
# each moved the needle and none produced a usable signal. A preference
# objective needs no reward variance: every pair carries a guaranteed margin.
#
# Set dpo.method: "orpo" for the ORPO variant (no reference model, no `beta`).
#
# output_dir keeps this run off any SFT/GRPO checkpoint path (CLAUDE.md R13).
output_dir: "dpo_cat_a"

stage: "dpo"
framework: "unsloth"

model:
  # C2 is the best Cat A checkpoint to date (R17): response_only @ a real 8192
  # window, task-a-sft-v2 corpus, held-out composite 0.7595.
  sft_checkpoint: "checkpoints/sft_cat_a_c2/gemma-4-26B-A4B-it/checkpoint-1767"

dpo:
  method: "dpo"
  training_steps: 500
  learning_rate: 5.0e-6
  # KL penalty against the implicit reference (TRL's `model.disable_adapter()`
  # fallback on this PEFT checkpoint — no second full model copy). DPO-only;
  # dropped by _filter_dpo_config_kwargs under method: orpo.
  beta: 0.1
  # Cache reference logps before training instead of re-deriving them each step.
  # Without this the run OOMs before step 1: Unsloth's compiled DPO trainer
  # materializes four full [2, S, 262144] fp32 logits tensors per step (policy
  # and reference, each .contiguous()-copied while the original is live) —
  # ~33 GiB at this corpus's median prompt length, ~64 GiB at max_seq_length
  # 8192. Precomputing drops the reference forward and its two tensors, and
  # removes a forward pass per step. Verified 2026-08-18; see the smoke logs
  # under checkpoints/dpo_cat_a_smoke*/.
  #
  # COST: one pass over the train split up front. The merged mix is 36,570 rows
  # but a 500-step run at effective batch 8 consumes only 4,000 — so this
  # front-loads ~9x more reference forwards than the run needs. Size the train
  # set to the run, or accept the wait.
  # MUTUALLY EXCLUSIVE with use_liger_kernel below — TRL raises at trainer
  # __init__ (after the 26B load) if both are set.
  #
  # This is the only memory lever available to us: liger is ruled out on PEFT
  # (see below). It removes the REFERENCE logits and their .contiguous() copy.
  # NOT SUFFICIENT ON ITS OWN at 8192 — the policy logits and their backward
  # gradient still OOM (measured: 6144 clears the forward pass, then
  # autograd.backward wants 5.78 GiB with 0.49 GiB free —
  # checkpoints/dpo_cat_a_smoke4/). max_seq_length must come down and the pair
  # set be length-filtered to match; see docs/ or the smoke logs.
  precompute_ref_log_probs: true
  # Fused chunked DPO loss. It WOULD be the right fix — it never materializes
  # the [2, S, 262144] logits tensor in either direction — but it is
  # UNAVAILABLE TO US: `_compute_loss_liger` raises
  #   NotImplementedError: Liger DPO loss is not implemented for PEFT models.
  # (UnslothDPOTrainer.py:1491), and every Cat A DPO run starts from a LoRA
  # adapter on the C2 checkpoint. Verified 2026-08-18,
  # checkpoints/dpo_cat_a_smoke6/. The kwarg is still plumbed through so this
  # flips to true the day TRL/Unsloth supports PEFT — it then also needs
  # `uv pip install liger-kernel`, which is deliberately NOT in pyproject's
  # [train] extra while the path is unusable.
  use_liger_kernel: false
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  max_seq_length: 8192
  max_completion_length: 512
  save_steps: 100
  save_total_limit: 3
  eval_steps: 100
  seed: 42

data:
  # scripts/build_preference_pairs.py (SYNTHETIC — corrupted gold turns) plus
  # scripts/mine_model_negatives.py (on-distribution — the checkpoint's own
  # greedy errors). See dvc.yaml: task_a_preference_pairs,
  # task_a_preference_model_negatives.
  train_sources:
    - "data/output/preference/task_a/train.jsonl"
    - "data/output/preference/task_a/model_negatives.jsonl"
  # DPO's own eval split. Built by dvc.yaml's task_a_preference_pairs stage
  # (build_preference_pairs.py --split validation) from the SAME GRPO
  # validation conversations that guardrail_reserved_fraction below
  # partitions. CAVEAT: that reserved slice protects ONLY the R5 held-out
  # guardrail, not this file. If mining is ever switched to
  # --split validation, its negatives would come from the ~80% non-reserved
  # population that also produced these eval pairs, contaminating eval_loss
  # and checkpoint selection — so flipping the mining source also requires
  # re-deriving this file from a partition disjoint from the minable pool.
  validation_source: "data/output/preference/task_a/validation.jsonl"
  # Mined negatives are on-distribution but scarce (51 of 399 sampled prompts
  # in the first mining run vs 29,256 synthetic pairs — well under 1% of a
  # plain concat). Oversample them (with replacement) to 20% of the merged
  # training set so the higher-value on-distribution rows are not drowned out.
  # None (the default) is a plain concat; a share at or below the natural rate
  # is also a passthrough. Revisit once the mining run investigates why yield
  # (12.8%) came in well under the 38.0% predicted from the held-out audit.
  model_negative_share: 0.2
  # Fraction of the GRPO validation split reserved for the R5 held-out
  # guardrail (dpo.py::_build_heldout_callback) and excluded from mining
  # (scripts/mine_model_negatives.py --split validation). Only meaningful if
  # mining is ever switched to --split validation — see
  # docs/superpowers/specs/2026-08-17-mining-yield-investigation-design.md.
  # Defaults to 0.2 if omitted; present here for discoverability.
  #
  # THESE TWO VALUES MUST MATCH mine_model_negatives.py's
  # --guardrail-reserved-fraction / --guardrail-reserved-seed (defaults
  # 0.2 / 42, invoked by dvc.yaml's task_a_preference_model_negatives stage).
  # Both sides call reserve_guardrail_slice independently and nothing enforces
  # agreement: a mismatch in EITHER value — or in the underlying corpus path
  # (heldout_data_source below vs that script's --data-dir) — silently yields
  # two DIFFERENT reserved sets, reintroducing the exact guardrail/mining
  # overlap this mechanism exists to prevent. Change one, change both.
  guardrail_reserved_fraction: 0.2
  guardrail_reserved_seed: 42
  # Held-out guardrail (below) scores greedy generations from this GRPO-format
  # corpus, not the preference-pair files — it needs whole prompts + ground
  # truth, not (chosen, rejected) pairs.
  heldout_data_source: "data/output/grpo/task_a"

monitoring:
  eval_held_out_every: 50
  eval_held_out_num_prompts: 50
  reward_hacking_detector: true

logging:
  wandb_project: "llm-workflow-agents-dpo"
