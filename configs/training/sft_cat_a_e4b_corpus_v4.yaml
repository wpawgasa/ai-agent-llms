# E4B, tool-results recipe, trained on the STAGE-1 REPAIRED corpus (R28).
#
# The A/B for "does repairing the SFT corpus move the v4 benchmark?". This file
# is sft_cat_a_e4b_textturns.yaml with two keys changed — output_dir and
# data.source — so the ONLY difference from the run that scored 0.8332 text /
# 0.8046 native on v4 is the training data. tests/unit/test_sft_cat_a_corpus_v4_config.py
# enforces that; changing anything else spends the experiment (R15, R16).
#
# The corpus is data/output/sft/task_a_splits_v4, built by
# scripts/repair_task_a_corpus.py from the ledger in
# data/interim/task_a_corpus_repair_ledger/. Against the original splits:
# confident unknowable tool arguments 443 -> 0, identifier reuse 70.5% -> 4.4%,
# orphan tool results 60 -> 0 (41 rows dropped), mergeable stay pairs 552 -> 1,
# rows sharing an identifier with the v4 benchmark 127 -> 52. NOT repaired here:
# 907 confident invented facts and 456 two-tool state visits — stage 2, bought
# only if this run pays.
#
# Row counts to check in train.log: 8,409 train / 986 validation (down from
# 8,441 / 992; the 41 dropped rows are the orphan-result conversations).
#
# output_dir keeps this run off every other checkpoint path (CLAUDE.md R13).
output_dir: "sft_cat_a_e4b_corpus_v4"

stage: "sft"
framework: "unsloth"

model:
  config_path: null

lora:
  # Unchanged from C2 so LoRA capacity is not a confound.
  rank: 16
  alpha: 16
  dropout: 0
  target_modules: "auto"   # ignored for Gemma-4 (toggle-flag form used)
  # false: see the comment on this key in sft_cat_a_c2_corpus_v3.yaml.
  freeze_router: false
  seed: 3407

training:
  precision: "bf16"
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  per_device_train_batch_size: 1
  effective_batch_size: 8
  optim: "adamw_8bit"
  weight_decay: 0.001
  num_epochs: 3
  # 8192 covers 99% of Task A conversations (median 4,264 / p90 6,055 / max
  # 9,108 tokens; scripts/measure_sft_token_budget.py). Verify this landed:
  # R16 records every Cat A SFT run before 2026-08-13 silently training at
  # max_length 1024 because TRL renamed the kwarg. Check train.log for
  # max_length=8192, and that loss is not 0.0, before letting the run proceed.
  max_seq_length: 8192
  gradient_checkpointing: true
  packing: false
  # Loss only on assistant spans; system/user/tool -> -100.
  #
  # MANDATORY on this corpus, not a preference. v3 contains voice rows whose
  # barge-in turn carries "loss": false, and all_tokens has no per-token
  # masking to honour it — it would train the model to emit the <unspoken>
  # marker (R20). sft.py logs all_tokens_ignores_loss_flag if this is wrong;
  # grep train.log for it and expect no hit.
  loss_mask: "response_only"

data:
  # task-a-sft-v3 (tag). Expected: 53f4fee095b3824b203344075cd3fdd7.dir
  # (3 files), 8,441 train / 992 validation / 499 test over 9,932 conversations
  # — 7,043 text and 2,889 voice. Check train.log's row counts, not this path:
  # the same path held v2 once (R13).
  source: "data/output/sft/task_a_splits_v4"
  format: "chatml"
  splits:
    train: 0.85
    val: 0.10
    test: 0.05

logging:
  wandb_project: "llm-workflow-agents-sft"
  save_steps: 500
  eval_steps: 500
  # Ranks checkpoints WITHIN this run only. eval_loss cannot rank this run
  # against C2-v3: the models differ, so their losses are not on one scale.
  # Rank arms with the held-out audit.
  metric_for_best_model: "eval_loss"
