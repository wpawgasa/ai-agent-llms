# Gemma-4 E4B in the Cat A orchestrator role.
#
# Copied from configs/models/cat_bc/gemma4_e4b.yaml with category set to "A"
# (docs/training_plan_voice_and_e4b.md section 4). It is the size arm of the
# E4B-vs-C2 comparison: SFT with configs/training/sft_cat_a_e4b.yaml.
#
# Dense model, so there is no `training.framework: trl` override. The 26B
# needs one only because Unsloth's MoE expert-LoRA path crashes on it; E4B
# takes sft.py's default Unsloth path, which trains the language layers and
# leaves the vision and audio towers frozen.
model:
  name: "google/gemma-4-E4B-it"
  # Kept from the cat_bc config. Neither sft.py nor serving/launch_vllm.sh
  # passes a revision, so this pin is recorded but not enforced: the Phase 1
  # Task A result (results/exp_a/google_gemma-4-E4B-it_auto.json) was served
  # from the Hub's latest revision at the time, ee0ef60.
  revision: "292a7e278a400932df35f9fd4b1501edd04133a5"
  family: "gemma"
  architecture: "dense_gqa_transformer"
  params_total: 4_000_000_000
  params_active: 4_000_000_000
  context_length: 262144
  precision: "bfloat16"
  vram_estimate_gb: 8

serving:
  engine: "vllm"
  tool_call_parser: "gemma4"
  chat_template: "gemma"
  gpu_memory_utilization: 0.90
  # 32768, not the 8192 the other Cat A configs use. The Task A benchmark
  # replays the model's own earlier replies, so prompts grow past the gold
  # conversation length: at 8192 an L3 conversation hit a 7,169-token prompt
  # plus 1,024 output tokens, returned HTTP 400, and scored those turns as
  # empty replies. The Phase 1 result was measured at 32768.
  max_model_len: 32768
  enforce_eager: false
  hf_overrides:
    rope_scaling: null

inference:
  temperature_deterministic: 0.0
  temperature_stochastic: 0.7
  stochastic_trials: 5
  max_tokens: 2048

category: "A"

benchmark_tasks:
  - "task_a"
