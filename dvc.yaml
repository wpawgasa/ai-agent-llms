stages:
  # ---------------------------------------------------------------------------
  # Task A — Multi-turn workflow conversations
  # See docs/data_generation_recipes.md for full rationale.
  # ---------------------------------------------------------------------------

  task_a_benchmark:
    # FROZEN. `dvc repro` skips this stage. Do not unfreeze it without reading
    # CLAUDE.md R21 first.
    frozen: true
    desc: >-
      FROZEN — the Phase 1 text benchmark stratum, and the data behind the
      current Cat A ranking. Do NOT regenerate it. 258 conversations in 17
      files: 250 teacher-generated (gemini-3-flash-preview for L1-L3,
      gemini-3-5-flash for L4-L5, generated 2026-06-11 and 2026-06-15), plus
      one hand-added l3_insurance_premium_payment_th_*.jsonl that does not
      follow the generator's naming convention. The `cmd` below is retained
      for provenance only and does NOT describe how these files were made —
      it runs the placeholder generator and would replace all 258 rows with
      1 000 placeholder ones. That mismatch is why this stage is frozen.
      The voice stratum (task_a_benchmark_voice) is additive alongside it.
    cmd: ./scripts/generate_benchmark_data.sh
    deps:
      - scripts/generate_benchmark_data.sh
      - src/llm_workflow_agents/data/generate_workflows.py
      - data/templates/workflow_prompt_template.txt
      - data/templates/tool_schemas_L1_to_L5.json
    params:
      - configs/benchmark/phase1_matrix.yaml:
          - task_a
    outs:
      - data/output/benchmark/task_a
    # Levels L1–L5, 200 samples/level, seed=100, lang=mixed, behavior=default

  task_a_benchmark_text_v2:
    # FROZEN 2026-09-15. `dvc repro` skips this stage. Scores on this set are
    # a separate scale from the v1 text stratum. See CLAUDE.md R25.
    frozen: true
    desc: >-
      FROZEN — the Phase 1 text benchmark stratum brought onto the tool-call
      stay rule (CLAUDE.md R25). The v1 text stratum at
      data/output/benchmark/task_a stays frozen and unchanged; this is a
      separate, versioned copy of the same 258 conversations. 177 need no
      change, 25 are relabelled in place, and 56 receive 143 authored inserts
      (87 assistant hand-off and closing turns, 56 user turns) replayed from
      the DVC-tracked ledger data/interim/task_a_benchmark_remediation_ledger,
      authored 2026-09-15 by the corpus-remediator agent (claude-opus-5[1m]),
      143 accepted and 0 rejected. System messages are byte-identical to v1.
      The hand-added l3_insurance_premium_payment_th file is copied unchanged:
      none of its 8 rows needs a convention change, but `apply` drops 3 of
      them (INS_PREMIUM_001-003) for an unrelated shape rule (consecutive
      assistant prose turns). Deterministic, no LLM calls at repro time.
      Frozen so a change to the repair code cannot silently change a test set
      that scores are measured on.
    cmd: >-
      rm -rf data/output/benchmark/task_a_v2 &&
      python scripts/remediate_task_a_states.py apply
      --input-dir data/output/benchmark/task_a
      --output-dir data/output/benchmark/task_a_v2
      --ledger-dir data/interim/task_a_benchmark_remediation_ledger
      --on-unrepairable drop &&
      cp data/output/benchmark/task_a/l3_insurance_premium_payment_th_20260609.jsonl
      data/output/benchmark/task_a_v2/
    deps:
      - data/output/benchmark/task_a
      - data/interim/task_a_benchmark_remediation_ledger
      - scripts/remediate_task_a_states.py
      - src/llm_workflow_agents/data/state_convention.py
      - src/llm_workflow_agents/data/state_convention_repair.py
    outs:
      - data/output/benchmark/task_a_v2

  task_a_benchmark_voice:
    # FROZEN 2026-09-11. `dvc repro` skips this stage. In production use as
    # the voice half of the Cat A composite blend since 2026-08-24 (see
    # CLAUDE.md R20/R24/R25); its deps (generate_workflows.py,
    # voice_convention.py, the tool-schema template) have since changed, so
    # an unfrozen `dvc repro` today would silently regenerate and swap the
    # data those risk entries are measured against.
    frozen: true
    desc: >-
      FROZEN — voice stratum for Phase 1, 250 conversations at 50 per level.
      Additive: the text stratum at data/output/benchmark/task_a is also
      FROZEN and must not be regenerated. Matched to it on size, language mix
      and generation source so modality is the only difference between the
      strata. Teacher model: gemini-3.5-flash (requires GEMINI_API_KEY). The
      `cmd` below is retained for provenance only.
    cmd: ./scripts/generate_benchmark_voice_data.sh
    deps:
      - scripts/generate_benchmark_voice_data.sh
      - src/llm_workflow_agents/data/generate_workflows.py
      - src/llm_workflow_agents/data/voice_convention.py
      - data/templates/tool_schemas_L1_to_L5.json
    outs:
      - data/output/benchmark/task_a_voice

  task_a_sft_generate:
    desc: >-
      Raw Task A SFT conversations from the teacher models (4 450 at last
      generation). Requires OPENAI_API_KEY and GEMINI_API_KEY. Split out from
      cleaning (2026-07-22) so a cleaning-script change doesn't force this
      expensive, non-deterministic teacher-API regen too.
    cmd: ./scripts/generate_sft_data.sh
    deps:
      - scripts/generate_sft_data.sh
      - src/llm_workflow_agents/data/generate_workflows.py
      - data/templates/workflow_prompt_template.txt
      - data/templates/tool_schemas_L1_to_L5.json
    outs:
      - data/output/sft/task_a
    # Levels L1–L5, seed=42, behavior=adversarial (87.5%) + cooperative_only (12.5%)
    # Legs: en/gpt-5.4-mini, th/gemini-3-flash-preview, code_switch/gpt-5.4-nano

  task_a_sft_generate_voice:
    desc: >-
      Voice (spoken) Task A conversations, 2400 at 20/50/30 en/th/code_switch.
      Every assistant turn splits into <S>...</S> chunks for a text-to-speech
      engine. Skips task_a_sft_remediate: that stage replays an authoring
      ledger keyed to specific existing conversations, and this batch needs no
      repair because require_tool_stay is on at generation time. Joins the
      chain at task_a_sft_clean. Requires a teacher API key.
      The runner ends with scripts/check_voice_batch.py, which fails the stage
      when the batch is mostly placeholder rows (spec risk 2) -- placeholder
      output is format-perfect, so without that gate a total teacher failure
      is indistinguishable from success.
    cmd: ./scripts/generate_voice_data.sh
    deps:
      - scripts/generate_voice_data.sh
      - scripts/check_voice_batch.py
      - src/llm_workflow_agents/data/generate_workflows.py
      - src/llm_workflow_agents/data/voice_convention.py
      - data/templates/workflow_prompt_template.txt
      - data/templates/tool_schemas_L1_to_L5.json
    outs:
      - data/output/sft/task_a_voice

  task_a_sft_remediate:
    desc: >-
      Bring the raw Task A corpus onto the tool-call state convention (a turn
      that emits <tool_call> annotates [STATE: X -> X]; the advance moves to
      a later turn). Deterministic: relabels the trajectory (never moving a
      tool call to a different state), then replays the DVC-tracked
      authoring ledger produced
      out-of-band by scripts/build_remediation_ledger.py. Every repaired row
      is re-validated and dropped on any violation. No API keys, no LLM
      calls at repro time. Produces task-a-sft-v2. See
      docs/task_a_state_convention_remediation_playbook.md. NOTE:
      --rebuild-prompts (below) hard-fails this stage if TASK_A_STAY_RULE=0
      is set in the ambient environment `dvc repro` inherits -- unset it (or
      leave it unset; default is on) before reproducing this stage.
    cmd: >-
      python scripts/remediate_task_a_states.py apply
      --input-dir data/output/sft/task_a
      --output-dir data/output/sft/task_a_remediated
      --ledger-dir data/interim/task_a_remediation_ledger
      --rebuild-prompts
      --on-unrepairable drop
    deps:
      - data/output/sft/task_a
      - data/interim/task_a_remediation_ledger
      - scripts/remediate_task_a_states.py
      - src/llm_workflow_agents/data/state_convention.py
      - src/llm_workflow_agents/data/state_convention_repair.py
    outs:
      - data/output/sft/task_a_remediated

  task_a_sft_clean:
    desc: >-
      Deterministic cleaning pass over the remediated (task-a-sft-v2) Task A
      corpus: structural fixes (clean_task_a_sft.py), then garbled-Thai
      removal (clean_corrupted_conversations.py). No API keys required. Row
      counts below predate the task_a_sft_remediate repoint (Task 13) and
      need re-verifying after the next `dvc repro`.
    cmd: >-
      python scripts/clean_task_a_sft.py
      --input-dir data/output/sft/task_a_remediated
      --input-dir data/output/sft/task_a_voice
      --output-dir data/output/sft/task_a_cleaned
      --quiet &&
      python scripts/clean_corrupted_conversations.py
      data/output/sft/task_a_cleaned/*.jsonl
      --no-backup
      --quiet
    deps:
      - data/output/sft/task_a_remediated
      - data/output/sft/task_a_voice
      - scripts/clean_task_a_sft.py
      - scripts/clean_corrupted_conversations.py
      - src/llm_workflow_agents/data/data_validator.py
    outs:
      - data/output/sft/task_a_cleaned
    # Cleanup: drops 5 truncated rows, strips 264 role-confused tool messages,
    #          flags 476 empty-terminal convs with terminal_reached=false
    # Corruption pass (added 2026-07-22): scripts/clean_corrupted_conversations.py
    #          drops teacher-transcription-corrupted (garbled Thai) rows in place,
    #          --no-backup so task_a_cleaned stays exactly the DVC-tracked *.jsonl
    #          set. Was a standalone/unwired tool before this; counts above predate
    #          it and need re-verifying after the next `dvc repro`.

  task_a_sft_splits:
    desc: >-
      Deterministic 85/10/5 train/validation/test split of the cleaned Task A
      SFT corpus. Seed=42. Reused across SFT training, GRPO training, and
      held-out evaluation. The shuffle runs per modality, so adding the voice
      batch does not reassign a single existing text conversation -- a
      positional shuffle over the concatenated pool moved 7 of the 278 pinned
      held-out candidates into train. Verify it after any merge with
      `--assert-unmoved <prior splits dir>`; that check is deliberately NOT in
      the cmd below, because the prior splits are this stage's own output and
      depending on them would make the stage irreproducible from scratch.
    cmd: >-
      python scripts/split_task_a_sft.py
      --input-dir data/output/sft/task_a_cleaned
      --output-dir data/output/sft/task_a_splits
      --force
    deps:
      - scripts/split_task_a_sft.py
      - data/output/sft/task_a_cleaned
    outs:
      - data/output/sft/task_a_splits

  task_a_grpo:
    desc: >-
      GRPO prompts: L3–L5 subset of the cleaned SFT splits (no new generation).
      Rewards are recomputed online from policy generations, so GRPO needs
      prompts — not labels. See docs/data_generation_recipes.md.
    cmd: >-
      python scripts/filter_grpo_data.py
        --input-dir data/output/sft/task_a_splits
        --output-dir data/output/grpo/task_a
    deps:
      - scripts/filter_grpo_data.py
      - data/output/sft/task_a_splits
    outs:
      - data/output/grpo/task_a
    # Filter only — L3-L5 of train.jsonl + validation.jsonl. test.jsonl is
    # reserved for final evaluation and is intentionally not included.

  task_a_preference_pairs:
    desc: >-
      Cat A contrastive preference pairs (DPO/ORPO), SYNTHETIC negatives.
      Built because GRPO cannot learn on this task — the reward is exactly 1.0
      on 81.1% of real completions, so groups tie and the advantage is zero
      (CLAUDE.md R18, docs/grpo_reward_resolution_investigation.md). A
      preference objective needs no reward variance.

      Each gold turn is paired against a corruption drawn from the failures the
      C2 policy actually makes: dropped tool call (announce-but-don't-call),
      self-loop/advance flip, and right-tool-wrong-arguments. Balanced to equal
      shares of the three.

      PREREQUISITE: the held-out set must be materialized first, because the
      contamination guard reads it —
          python scripts/build_heldout_clean_set.py ... \
              --out-dir data/output/heldout/cat_a_v2_test_not_in_v1
      It is deliberately not a dep: it is gitignored and rebuilt on demand from
      two git tags (see cee970a). Without it this stage fails loudly rather
      than silently skipping the guard.

      Outs are the two files, NOT the directory, so `dvc repro` does not delete
      model_negatives.jsonl produced alongside them by the GPU stage below.
    cmd: >-
      python scripts/build_preference_pairs.py --split train
        --heldout data/output/heldout/cat_a_v2_test_not_in_v1/test.jsonl
        --out data/output/preference/task_a/train.jsonl &&
      python scripts/build_preference_pairs.py --split validation
        --heldout data/output/heldout/cat_a_v2_test_not_in_v1/test.jsonl
        --out data/output/preference/task_a/validation.jsonl
    deps:
      - scripts/build_preference_pairs.py
      - src/llm_workflow_agents/data/preference_pairs.py
      - src/llm_workflow_agents/data/heldout_clean_set.py
      - data/output/grpo/task_a
    outs:
      - data/output/preference/task_a/train.jsonl
      - data/output/preference/task_a/validation.jsonl

  task_a_preference_model_negatives:
    desc: >-
      On-distribution negatives mined from the policy's OWN greedy generations,
      to complement the synthetic corruptions above. R18: synthetic-only
      negatives teach the model to discriminate against the corruption function
      rather than to get the task right — the same trap R15 documents at corpus
      level.

      Requires a GPU (~35 min on an H100 for 400 prompts). Selection is biased
      75% toward tool-bearing turns because greedy decoding is wrong on 38.0%
      of those versus 8.9% of no-tool turns, so the yield per GPU-minute is far
      higher and lands on the current bottleneck.

      Mines from TRAIN only. The script hard-refuses --split test, and the
      prefix-fingerprint contamination guard is applied, because the held-out
      conversations are the only contamination-free measuring stick for this
      lineage.

      Mining source is --split train, deliberately: the split-effect
      hypothesis for why this yields far fewer negatives than the held-out
      audit's 38.0% error rate (see docs/superpowers/specs/
      2026-08-17-mining-yield-investigation-design.md and
      scripts/investigate_mining_yield.py) has not been confirmed with a
      real measurement.

      DO NOT simply flip --split to "validation" here if it is confirmed.
      mine_model_negatives.py does support it and does exclude the R5
      guardrail's reserved slice automatically, but that reserved slice
      protects ONLY dpo.py's R5 held-out guardrail — it does NOT protect
      DPO's own eval split. configs/training/dpo_cat_a.yaml's
      data.validation_source (data/output/preference/task_a/validation.jsonl)
      is built by the task_a_preference_pairs stage above from the SAME GRPO
      validation conversations, so mining validation would draw negatives
      from the ~80% non-reserved population that also feeds DPO's eval pairs,
      contaminating eval_loss and checkpoint selection with rows that are
      simultaneously training-mix negatives. Flipping the mining source
      therefore ALSO requires re-deriving
      data/output/preference/task_a/validation.jsonl from a partition
      disjoint from the minable pool (i.e. a three-way minable / DPO-eval /
      R5-guardrail partition, which does not exist yet).

      PARAMETER-MATCH REQUIREMENT: --guardrail-reserved-fraction and
      --guardrail-reserved-seed (defaults 0.2 / 42, not passed in cmd below)
      MUST match data.guardrail_reserved_fraction and
      data.guardrail_reserved_seed in configs/training/dpo_cat_a.yaml, which
      is where dpo.py::_build_heldout_callback reads them from. The two call
      sites invoke reserve_guardrail_slice independently and nothing enforces
      agreement: a mismatch in EITHER the fraction/seed OR the underlying
      corpus path (--data-dir here vs data.heldout_data_source there)
      silently produces two DIFFERENT reserved sets, reintroducing the exact
      guardrail/mining overlap this mechanism exists to prevent. Change one,
      change both.
    cmd: >-
      python scripts/mine_model_negatives.py
        --checkpoint checkpoints/sft_cat_a_c2/gemma-4-26B-A4B-it/checkpoint-1767
        --heldout data/output/heldout/cat_a_v2_test_not_in_v1/test.jsonl
        --n-prompts 400 --tool-share 0.75
        --out data/output/preference/task_a/model_negatives.jsonl
    deps:
      - scripts/mine_model_negatives.py
      - src/llm_workflow_agents/data/heldout_clean_set.py
      - data/output/grpo/task_a
      - checkpoints/sft_cat_a_c2/gemma-4-26B-A4B-it
    outs:
      - data/output/preference/task_a/model_negatives.jsonl

  task_a_eval:
    desc: >-
      500 validation + 500 test held-out conversations.
      Requires OPENAI_API_KEY.
    cmd: ./scripts/generate_eval_data.sh
    deps:
      - scripts/generate_eval_data.sh
      - src/llm_workflow_agents/data/generate_workflows.py
      - data/templates/workflow_prompt_template.txt
      - data/templates/tool_schemas_L1_to_L5.json
    outs:
      - data/output/val/task_a    # seed=300
      - data/output/test/task_a   # seed=400
    # Levels L1–L5, 100 samples/level/split, lang=mixed, behavior=default
    # test split must NOT be used during training or hyperparameter selection

  # ---------------------------------------------------------------------------
  # Phase 2 — SFT fine-tuning
  # ---------------------------------------------------------------------------

  task_a_sft_gemma4_26b_a4b:
    desc: >-
      Phase 2 SFT — Gemma-4 26B-A4B-it on cleaned Task A data. Outputs
      LoRA adapter checkpoints at every save_steps interval plus the
      train log under checkpoints/sft_cat_a/gemma-4-26B-A4B-it/.

      Training takes several hours on an H100. To register an existing
      checkpoint without re-running training, use:
          dvc commit task_a_sft_gemma4_26b_a4b
      Push to the GCS remote afterwards:
          dvc push task_a_sft_gemma4_26b_a4b
    cmd: >-
      ./scripts/run_phase2_sft.sh
      --model-config configs/models_exp_a/gemma4_26b_a4b.yaml
      --sft-config configs/training/sft_cat_a.yaml
    deps:
      - scripts/run_phase2_sft.sh
      - src/llm_workflow_agents/training/sft.py
      - src/llm_workflow_agents/training/lora_targets.py
      - configs/models_exp_a/gemma4_26b_a4b.yaml
      - configs/training/sft_cat_a.yaml
      - data/output/sft/task_a_splits
    outs:
      - checkpoints/sft_cat_a/gemma-4-26B-A4B-it

  task_a_sft_gemma4_26b_a4b_c2:
    desc: >-
      Phase 2 SFT — cell C2 (response_only @ 8192) on the task-a-sft-v2 corpus.
      Probes whether the tool-call stay convention survives a better-trained
      cell, after C0 regressed held-out
      (docs/cat_a_corpus_v2_heldout_regression.md). Two variables move versus
      C0 — loss mask and sequence length — so this cell cannot attribute the
      corpus effect on its own; run C1 to separate them.

      Writes to checkpoints/sft_cat_a_c2/ via the config's output_dir key so it
      does not overwrite the C0 lineage (CLAUDE.md R13,
      docs/data_and_model_versioning.md §4).

      eval_loss is NOT comparable across loss_mask recipes — rank cells with
      scripts/heldout_composite_audit.py on a contamination-free set.

      To register an existing checkpoint without re-running training:
          dvc commit task_a_sft_gemma4_26b_a4b_c2
          dvc push  task_a_sft_gemma4_26b_a4b_c2
    cmd: >-
      ./scripts/run_phase2_sft.sh
      --model-config configs/models_exp_a/gemma4_26b_a4b.yaml
      --sft-config configs/training/sft_cat_a_c2.yaml
    deps:
      - scripts/run_phase2_sft.sh
      - src/llm_workflow_agents/training/sft.py
      - src/llm_workflow_agents/training/lora_targets.py
      - configs/models_exp_a/gemma4_26b_a4b.yaml
      - configs/training/sft_cat_a_c2.yaml
      - data/output/sft/task_a_splits
    outs:
      - checkpoints/sft_cat_a_c2/gemma-4-26B-A4B-it

  task_a_sft_gemma4_e4b:
    # FROZEN. `dvc repro` skips this stage: its cmd is a ~6.3 h GPU run that
    # would overwrite the registered weights the first time a dep changes.
    # Unfreeze only to retrain on purpose.
    frozen: true
    desc: >-
      FROZEN — Phase 2 SFT of gemma-4-E4B with the C2 recipe (response_only
      @ 8192) on corpus/task-a-v3. The size arm of the E4B-vs-C2-v3 comparison
      (docs/training_plan_voice_and_e4b.md); the 26B C2-v3 arm is not trained on
      this machine, so that comparison is still open.

      RESULT: 3 epochs, 3,168 steps, best eval_loss 0.4314 at the final
      checkpoint-3168. On the Phase 1 Task A benchmark (text + voice, 0
      stochastic trials, 32K context) it scores 0.6678 blended quality against
      the untrained E4B's 0.6131 (results/exp_a/sft_cat_a_e4b_ckpt3168_auto.json).
      That is not a held-out audit and is not comparable to C2's 0.7595.

      Trained with lora.freeze_router: false, so the gate_proj adapters trained
      (CLAUDE.md R24), on code 84c9f00, whose warmup fix the run needed under
      transformers 5.17. Three invocations wrote frozen_sft_config_*.yaml into
      the checkpoint directory. The first two failed before step 1 (a
      warmup_ratio TypeError, then a rejected W&B key) and wrote no weights; the
      weights come from the third, frozen_sft_config_20260913T165120Z.yaml.

      To register an existing checkpoint without re-running training:
          dvc commit task_a_sft_gemma4_e4b
          dvc push  task_a_sft_gemma4_e4b
    cmd: >-
      ./scripts/run_phase2_sft.sh
      --model-config configs/models_exp_a/gemma4_e4b.yaml
      --sft-config configs/training/sft_cat_a_e4b.yaml
    deps:
      - scripts/run_phase2_sft.sh
      - src/llm_workflow_agents/training/sft.py
      - src/llm_workflow_agents/training/_utils.py
      - src/llm_workflow_agents/training/lora_targets.py
      - configs/models_exp_a/gemma4_e4b.yaml
      - configs/training/sft_cat_a_e4b.yaml
      - data/output/sft/task_a_splits
    outs:
      - checkpoints/sft_cat_a_e4b/gemma-4-E4B-it

  task_a_sft_gemma4_12b:
    # FROZEN. `dvc repro` skips this stage: its cmd is a ~16 h GPU run that
    # would overwrite the registered weights the first time a dep changes.
    # Unfreeze only to retrain on purpose.
    frozen: true
    desc: >-
      FROZEN — Phase 2 SFT of gemma-4-12B with the C2 recipe (response_only
      @ 8192) on corpus/task-a-v3. A size arm next to E4B
      (task_a_sft_gemma4_e4b) on the same corpus and recipe; the config differs
      from E4B's in output_dir only (tests/unit/test_sft_cat_a_12b_config.py).

      RESULT: 3 epochs, 3,168 steps in 58,820 s (16.3 h), best eval_loss
      0.39895 at the final checkpoint-3168 (E4B: 0.4314 on the same validation
      split; eval_loss does not rank models of different size).

      gemma-4-12B is a dense gemma4_unified model. It trained through
      Unsloth's generic path (Unsloth 2026.9.4 has no mapper entry for it),
      needed the gemma4_12b LoRA registry entry from d899b55, and trained with
      lora.freeze_router: false (no router, so nothing to freeze). One
      invocation; frozen_sft_config_20260914T112605Z.yaml beside train.log is
      its record. Grad norm ran higher than E4B's (median 1.6-1.8 early against
      0.34), so most steps were clipped at the default max_grad_norm 1.0; loss
      fell smoothly throughout.

      To register an existing checkpoint without re-running training:
          dvc commit task_a_sft_gemma4_12b
          dvc push  task_a_sft_gemma4_12b
    cmd: >-
      ./scripts/run_phase2_sft.sh
      --model-config configs/models_exp_a/gemma4_12b.yaml
      --sft-config configs/training/sft_cat_a_12b.yaml
    deps:
      - scripts/run_phase2_sft.sh
      - src/llm_workflow_agents/training/sft.py
      - src/llm_workflow_agents/training/_utils.py
      - src/llm_workflow_agents/training/lora_targets.py
      - configs/models_exp_a/gemma4_12b.yaml
      - configs/training/sft_cat_a_12b.yaml
      - data/output/sft/task_a_splits
    outs:
      - checkpoints/sft_cat_a_12b/gemma-4-12B-it

  # ---------------------------------------------------------------------------
  # Phase 2 — GRPO RL fine-tuning
  # ---------------------------------------------------------------------------

  task_a_dpo_gemma4_26b_a4b:
    # FROZEN. `dvc repro` skips this stage. Its cmd is a multi-hour GPU run,
    # and the weights on disk did NOT come from one clean invocation — see the
    # desc. Do not unfreeze without reading CLAUDE.md R22.
    frozen: true
    desc: >-
      FROZEN — Phase 2 preference learning (DPO) on the C2 checkpoint, 500
      steps in five 100-step chunks with the R5 held-out guardrail scored
      BETWEEN chunks in a separate process (CLAUDE.md R19, R22).

      RESULT: a null result. checkpoint-400 scores 0.7566 on the pinned
      206-row contamination-free set against C2's 0.7595, and 199 of those 206
      rows are byte-identical. The preference pairs are too easy — training
      loss reached 0.0035 — so the DPO gradient vanishes. C2 remains the best
      Cat A checkpoint. See docs/cat_a_dpo_null_result.md.

      THE cmd BELOW IS RECORDED FOR PROVENANCE, NOT REPRODUCTION. These
      weights came from TWO invocations: the first was interrupted at chunk 3
      and the second resumed from checkpoint-200. `save_total_limit: 3` then
      pruned checkpoint-100 and checkpoint-200, so the directory holds only
      300/400/500. The faithful record is the ten frozen_dpo_config_*.yaml
      files beside train.log, from both invocations.

      To register an existing checkpoint without re-running training:
          dvc commit task_a_dpo_gemma4_26b_a4b
          dvc push  task_a_dpo_gemma4_26b_a4b
    cmd: >-
      ./scripts/run_phase2_dpo.sh
      --dpo-config configs/training/dpo_cat_a.yaml
      --skip-pairs --chunk-steps 100
    deps:
      - scripts/run_phase2_dpo.sh
      - scripts/dpo_guardrail_decide.py
      - src/llm_workflow_agents/training/dpo.py
      - configs/training/dpo_cat_a.yaml
      - data/output/preference/task_a/cap6144
      - checkpoints/sft_cat_a_c2/gemma-4-26B-A4B-it
    outs:
      - checkpoints/dpo_cat_a/gemma-4-26B-A4B-it

  task_a_grpo_gemma4_26b_a4b:
    desc: >-
      Phase 2 GRPO — Gemma-4 26B-A4B-it RL fine-tune seeded from the
      task_a_sft_gemma4_26b_a4b SFT checkpoint-500 (epoch 0.91; see
      docs/grpo_diagnosis_gemma4_26b.md for why this specific checkpoint).
      Outputs LoRA adapter checkpoints at every save_steps interval plus
      the train log under checkpoints/grpo_cat_a/gemma-4-26B-A4B-it/.

      Training takes ~13 hours on an H100 (Gemma-4 R9 fallback — HF
      rollouts, no vLLM). To register an existing checkpoint without
      re-running training, use:
          dvc commit task_a_grpo_gemma4_26b_a4b
      Push to the GCS remote afterwards:
          dvc push task_a_grpo_gemma4_26b_a4b

      Reward function, weights, and graded scoring helpers are tracked
      as explicit deps so any change to them invalidates the run (per
      the 2026-05-19 reward redesign addendum).
    cmd: >-
      ./scripts/run_phase2_grpo.sh
      --model-config configs/models_exp_a/gemma4_26b_a4b.yaml
      --grpo-config configs/training/grpo_cat_a.yaml
      --sft-checkpoint checkpoints/sft_cat_a/gemma-4-26B-A4B-it/checkpoint-500
      --skip-filter
    deps:
      - scripts/run_phase2_grpo.sh
      - src/llm_workflow_agents/training/grpo.py
      - src/llm_workflow_agents/training/lora_targets.py
      - src/llm_workflow_agents/training/reward_utils.py
      - src/llm_workflow_agents/training/rewards/reward_business_logic.py
      - src/llm_workflow_agents/eval/tool_call_f1.py
      - configs/models_exp_a/gemma4_26b_a4b.yaml
      - configs/training/grpo_cat_a.yaml
      - data/output/grpo/task_a
      - checkpoints/sft_cat_a/gemma-4-26B-A4B-it
    outs:
      - checkpoints/grpo_cat_a/gemma-4-26B-A4B-it

  # ---------------------------------------------------------------------------
  # Task B stages will be added once the recipe is defined.
  # ---------------------------------------------------------------------------

  task_c_pairs_generate:
    desc: >-
      ~5,000 playbook -> WorkflowGraph pairs (Task C SFT corpus), seed=142.
      Requires OPENAI_API_KEY and GEMINI_API_KEY. See
      docs/data_generation_recipes_task_c.md.
    cmd: ./scripts/generate_playbook_sft_data.sh
    deps:
      - scripts/generate_playbook_sft_data.sh
      - src/llm_workflow_agents/data/generate_playbook_pairs.py
      - src/llm_workflow_agents/data/_graph_invention.py
      - src/llm_workflow_agents/data/_playbook_render.py
      - src/llm_workflow_agents/data/_playbook_verify.py
      - src/llm_workflow_agents/data/_workflow_script.py
      - src/llm_workflow_agents/data/domain_registry.py
      - src/llm_workflow_agents/eval/graph_extraction_eval.py
      - data/templates/graph_output_schema.json
    outs:
      - data/output/sft/task_c

  task_c_pairs_clean:
    desc: >-
      Re-validate, dedupe, and drop malformed Task C pairs.
    cmd: >-
      python scripts/clean_task_c_pairs.py
      --input-dir data/output/sft/task_c
      --output-dir data/output/sft/task_c_cleaned
      --quiet
    deps:
      - scripts/clean_task_c_pairs.py
      - data/output/sft/task_c
    outs:
      - data/output/sft/task_c_cleaned

  task_c_pairs_split:
    desc: >-
      Group-wise train/validation/test partition of Task C pairs by the
      generator-recorded split field, with held-out domain/register checks.
    cmd: >-
      python scripts/split_task_c_pairs.py
      --input-dir data/output/sft/task_c_cleaned
      --output-dir data/output/sft/task_c_splits
      --group-key graph_id
      --heldout-domains utilities,surveys
      --heldout-registers manager_transcript
      --seed 142
      --force
    deps:
      - scripts/split_task_c_pairs.py
      - data/output/sft/task_c_cleaned
    outs:
      - data/output/sft/task_c_splits
